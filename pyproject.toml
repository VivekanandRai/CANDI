[project]
name = "intrinsic-hall"
version = "1.0.0"
description = "Eliciting intrinsic hallucinations in large language models via adversarial attacks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Atri Sharma" }]
keywords = ["hallucination", "adversarial-attacks", "llm", "rag", "red-teaming"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Local model loading and generation (white-box attacks)
    "torch==2.5.1",
    "transformers==4.46.3",
    "accelerate==1.1.1",
    # Attack-specific utilities
    "nltk==3.9.1",
    "pyspellchecker==0.8.2",
    "sentence-transformers==3.3.1",
    # Coherence / similarity metrics. rouge-score is soft-imported by
    # methods/base_attack_method.py; without it every ROUGE metric is None.
    "rouge-score==0.1.2",
    "numpy==1.26.4",
    # OpenRouter API access (black-box attacks, and all LLM judges)
    "requests==2.32.3",
    "aiohttp==3.11.10",
    "openai==1.57.0",
    # Runtime plumbing
    "python-dotenv==1.0.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["ruff==0.8.4"]

[project.urls]
Repository = "https://github.com/atriviveksharma/intrinsic_hall"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["dataset", ".venv"]

[tool.ruff.lint]
# Deliberately conservative: this is research code released as an artifact, so
# the goal is catching real breakage (undefined names, bad imports), not
# restyling the paper's implementation.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
