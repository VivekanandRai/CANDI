name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check no credentials are committed
        run: |
          if grep -rIE 'sk-or-v1-[A-Za-z0-9]|hf_[A-Za-z0-9]{20,}' \
               --exclude-dir=.git --exclude-dir=dataset --exclude-dir=.venv . ; then
            echo "::error::Possible credential found in the repository"
            exit 1
          fi
          echo "No credentials found."
